# Configuração do pytest.
#
# `testpaths` existe por um motivo concreto: `scripts/smoke_test.py` tem funções cujo nome
# começa com `testar_`/`test`, e o pytest as coletava como se fossem testes — quebrando a
# suíte com um erro de coleta que não tinha nada a ver com o código. O smoke test é um
# script executável, não um teste de unidade: ele sobe um servidor de verdade e roda por
# `python3 scripts/smoke_test.py`.
[pytest]
testpaths = tests
python_files = test_*.py
