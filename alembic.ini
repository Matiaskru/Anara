# Alembic — controle de esquema do banco da Anara (Fase 0).
#
# A URL do banco NÃO fica aqui: `alembic/env.py` resolve o caminho a partir de
# `app.db.DB_PATH`, e a variável de ambiente ANARA_DB_URL sobrepõe quando é preciso
# rodar contra uma cópia (ensaio, teste, restore). Assim ninguém aponta uma migration
# para o banco errado por esquecer de editar um arquivo.

[alembic]
script_location = alembic
prepend_sys_path = .
# revisões nomeadas por ordem: 0001_..., 0002_...
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
