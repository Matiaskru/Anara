<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anara Cotações — Entrar</title>
  <link rel="stylesheet" href="/static/css/anara.css">
  <link rel="icon" href="/static/img/anara_mark_copper.png">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <img src="/static/img/anara_mark_copper.png" alt="Anara">
      <div class="word">ANARA</div>
      <div class="tagline">A Higher Standard of Comfort</div>
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field" style="text-align:left">
          <label>Senha de acesso</label>
          <input type="password" name="senha" autofocus required>
        </div>
        <button class="btn btn-copper" type="submit" style="width:100%; justify-content:center;">Entrar</button>
        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
      </form>
    </div>
  </div>
</body>
</html>
