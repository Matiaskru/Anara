<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anara — Entrar</title>
  <link rel="stylesheet" href="/static/css/anara.css?v={{ versao_estatica }}">
  <link rel="icon" href="/static/img/anara_mark_copper.png">
</head>
<body>
  <div class="login-page">
    <form class="login-card" method="post" action="/login">
      <div class="marca">
        <img src="/static/img/anara_mark_copper.png" alt="">
        <div class="word">ANARA</div>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" name="email" value="{{ email or '' }}" autocomplete="username"
               autofocus required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" type="password" name="senha" autocomplete="current-password" required>
      </div>
      <button class="btn btn-copper" type="submit">Entrar</button>
      {% if erro %}<div class="erro" role="alert">{{ erro }}</div>{% endif %}
      <div class="rodape-login"><a href="/esqueci-senha">Esqueci minha senha</a></div>
    </form>
  </div>
</body>
</html>
